name: free-sadtalker-pool
on:
  push:
    branches: [sadtalker-free-pool]
  workflow_dispatch:

jobs:
  talk:
    strategy:
      fail-fast: false
      matrix:
        space:
          - henrybit/SadTalker-Demo
          - lithiumice/SadTalker
          - John6666/SadTalker
          - bagbmxt/sadtalker-server
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install client
        run: python -m pip install --upgrade gradio_client requests
      - name: Download inputs
        run: |
          python - <<'PY'
          import requests
          for p,u in {
            'face.jpg':'https://cdn.creativeclaw.co/u/18b47ea6/images/5b90400d-febe-4e49-bcd6-3231792e76ec.jpg',
            'audio.mp3':'https://cdn.creativeclaw.co/u/18b47ea6/audio/d6551629-6299-412c-95a3-89f96910488b.mp3'
          }.items():
              r=requests.get(u,timeout=120); r.raise_for_status(); open(p,'wb').write(r.content)
          PY
      - name: Try SadTalker
        env:
          SPACE: ${{ matrix.space }}
        run: |
          timeout 720s python - <<'PY'
          import os, shutil, requests
          from gradio_client import Client, handle_file
          space=os.environ['SPACE']; safe=space.replace('/','__'); out=f'sad_{safe}.mp4'
          print('SPACE',space,flush=True)
          c=Client(space, verbose=True)

          def grab(x):
              if isinstance(x,str):
                  if os.path.exists(x) and x.lower().endswith(('.mp4','.mov','.mkv','.webm')): return x
                  if x.startswith('http'):
                      try:
                          r=requests.get(x,timeout=120)
                          if r.ok:
                              open(out,'wb').write(r.content); return out
                      except Exception: pass
              if isinstance(x,dict):
                  for k in ['video','path','name','url']:
                      if k in x:
                          p=grab(x[k])
                          if p:return p
                  for v in x.values():
                      p=grab(v)
                      if p:return p
              if isinstance(x,(list,tuple)):
                  for v in x:
                      p=grab(v)
                      if p:return p
              return None

          # SadTalker common 16-input signature. Natural blink/head movement enabled.
          args=[handle_file('face.jpg'),handle_file('audio.mp3'),'crop',False,False,1,256,0,'facevid2vid',1.0,False,None,'pose',False,5,True]
          tried=[]
          try:
              api=c.view_api(return_format='dict')
              print('API',api,flush=True)
              named=(api or {}).get('named_endpoints',{}) if isinstance(api,dict) else {}
          except Exception as e:
              print('VIEW ERR',repr(e),flush=True); named={}

          candidates=[]
          for name,spec in named.items():
              ps=spec.get('parameters',[]) if isinstance(spec,dict) else []
              d=' '.join(str(p) for p in ps).lower()
              if 'source image' in d and ('audio' in d or 'driven' in d): candidates.append((name,len(ps)))
          candidates += [('/generate',16),('/predict',16),(None,16)]

          ok=False
          for name,n in candidates:
              try:
                  callargs=args[:n]
                  print('TRY',name,n,flush=True)
                  if name:
                      r=c.predict(*callargs,api_name=name)
                  else:
                      r=c.predict(*callargs,fn_index=0)
                  print('RESULT',r,flush=True)
                  p=grab(r)
                  if p:
                      if p!=out: shutil.copy2(p,out)
                      ok=True; break
              except Exception as e:
                  tried.append((name,n,repr(e))); print('ERR',name,n,repr(e),flush=True)
          if not ok:
              # Try the most likely fn indexes too.
              for fn in range(1,8):
                  try:
                      print('TRY FN',fn,flush=True)
                      r=c.predict(*args,fn_index=fn)
                      p=grab(r)
                      if p:
                          if p!=out: shutil.copy2(p,out)
                          ok=True; break
                  except Exception as e:
                      tried.append((f'fn{fn}',16,repr(e)))
          if not ok:
              print('ERRORS',tried[-20:],flush=True); raise RuntimeError('SadTalker space failed')
          print('DONE',out,os.path.getsize(out),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: sadtalker-${{ strategy.job-index }}
          path: sad_*.mp4
          retention-days: 1
